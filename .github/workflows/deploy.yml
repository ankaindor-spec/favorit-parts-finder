name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: favorit-parts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          FAVORIT_KEY_FROM_ACTIONS: ${{ vars.VITE_FAVORIT_API_KEY || secrets.VITE_FAVORIT_API_KEY }}
        run: |
          if [ -n "$FAVORIT_KEY_FROM_ACTIONS" ]; then
            echo "API key source: GitHub Actions variable or secret"
            export VITE_FAVORIT_API_KEY="$FAVORIT_KEY_FROM_ACTIONS"
          else
            echo "API key source: .env.production public demo key"
          fi
          npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build
        env:
          FAVORIT_KEY_FROM_ACTIONS: ${{ vars.VITE_FAVORIT_API_KEY || secrets.VITE_FAVORIT_API_KEY }}
        run: |
          if [ -n "$FAVORIT_KEY_FROM_ACTIONS" ]; then
            echo "API key source: GitHub Actions variable or secret"
            export VITE_FAVORIT_API_KEY="$FAVORIT_KEY_FROM_ACTIONS"
          else
            echo "API key source: .env.production public demo key"
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
